services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: empdept
      POSTGRES_USER: empdept
      POSTGRES_PASSWORD: ${DB_PASSWORD:-empdept}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empdept -d empdept"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/empdept
      DB_USER: empdept
      DB_PASSWORD: ${DB_PASSWORD:-empdept}
      APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY, e.g. APP_API_KEY=change-me docker compose up}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
